<!DOCTYPE html>
<html lang="en">

<body>
    <!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>趣味颜色测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm text-center">
    
    <!-- 问题页面 -->
    <div id="question-box">
      <h2 class="text-xl font-bold text-slate-800 mb-6">你最喜欢什么颜色？</h2>
      <div class="space-y-3">
        <button onclick="showResult('红色', '代表热情、活力与坚强的意志力！')" class="w-full py-3 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl transition">🔴 红色</button>
        <button onclick="showResult('蓝色', '代表理性、沉稳与深邃的思考力！')" class="w-full py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-xl transition">🔵 蓝色</button>
        <button onclick="showResult('绿色', '代表自然、和平与极强的治愈力！')" class="w-full py-3 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-xl transition">🟢 绿色</button>
        <button onclick="showResult('黄色', '代表明亮、创造与无尽的想象力！')" class="w-full py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold rounded-xl transition">🟡 黄色</button>
      </div>
    </div>

    <!-- 结果页面（默认隐藏） -->
    <div id="result-box" class="hidden">
      <h3 class="text-lg font-bold text-slate-700 mb-2">你的测试结果</h3>
      <p id="color-title" class="text-2xl font-extrabold my-3"></p>
      <p id="color-desc" class="text-slate-600 text-sm mb-6"></p>
      <button onclick="location.reload()" class="px-5 py-2 bg-slate-800 text-white text-xs font-semibold rounded-full hover:bg-slate-700 transition">重新测试</button>
    </div>

  </div>

  <script>
    function showResult(color, desc) {
      document.getElementById('question-box').classList.add('hidden');
      document.getElementById('result-box').classList.remove('hidden');
      document.getElementById('color-title').innerText = "你选择了：" + color;
      document.getElementById('color-desc').innerText = desc;
    }
  </script>

</body>
</html>
</body>
</html>
